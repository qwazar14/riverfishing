modLoader="javafml"
loaderVersion="[4,)"
license="All Rights Reserved (source-available, see LICENSE.txt)"
issueTrackerURL="https://github.com/qwazar14/riverfishing/issues"

# NeoForge has no structured field for a chat link, so the invite also lives in the description below —
# that is the text the mod list actually shows.

# §multiloader (1.21.1): NeoForge loads mixin configs from this file. The common koi-release mixin
# applies on both loaders; the Forge-client BEWLR mixins are replaced on NeoForge by
# RegisterClientExtensionsEvent (see the client stage), so no NeoForge client mixin config here yet.
[[mixins]]
config="riverfishing.mixins.json"

[[mods]]
modId="riverfishing"
version="${version}"
displayName="River Fishing"
logoFile="icon.png"
authors="Qwazar"
displayURL="https://github.com/qwazar14/riverfishing"
description='''
A deep, realistic river & ice-fishing simulator built as a modpack anchor.

Discord: https://discord.gg/Kk2nKvsuRh
'''

[[dependencies.riverfishing]]
    modId="neoforge"
    type="required"
    versionRange="[26.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.riverfishing]]
    modId="minecraft"
    type="required"
    versionRange="${mcRangeNeo}"
    ordering="NONE"
    side="BOTH"

[[dependencies.riverfishing]]
    modId="architectury"
    type="required"
    versionRange="[20,)"
    ordering="AFTER"
    side="BOTH"

# Soft dependencies — features light up if present (§recommended-companions).
[[dependencies.riverfishing]]
    modId="sereneseasons"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.riverfishing]]
    modId="biomesoplenty"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
